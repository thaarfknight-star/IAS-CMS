name: Build Desktop EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      quick_test:
        description: 'بیلد سریع برای تست: PyInstaller (چند دقیقه، بدون کامپایل C) بجای Nuitka onefile (چند ساعت) - فقط وقتی دستی (Run workflow) اجرا کنید فعال است'
        type: boolean
        default: true

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Cache pip-built wheels (dlib و بقیه)
      id: pip-wheel-cache
      uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Local\pip\Cache
        key: pip-wheels-windows-py310-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          pip-wheels-windows-

    - name: Install CMake (فقط وقتی dlib هنوز کش‌نشده)
      if: steps.pip-wheel-cache.outputs.cache-hit != 'true'
      run: |
        choco install cmake --installargs "ADD_CMAKE_TO_PATH=System" --no-progress

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools<70" wheel
        pip install dlib --only-binary :all: || pip install dlib
        pip install git+https://github.com/ageitgey/face_recognition_models
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: Cache YOLOv8n weights
      id: yolo-weights-cache
      uses: actions/cache@v4
      with:
        path: yolov8n.pt
        key: yolov8n-weights-v1

    - name: Download YOLOv8n weights (فقط اگر در کش نبود)
      if: steps.yolo-weights-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"
        if (-not (Test-Path "yolov8n.pt")) {
          $found = Get-ChildItem -Path $env:USERPROFILE -Recurse -Filter "yolov8n.pt" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) { Copy-Item $found.FullName -Destination "yolov8n.pt" }
        }
        if (-not (Test-Path "yolov8n.pt")) {
          Invoke-WebRequest -Uri "https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt" -OutFile "yolov8n.pt"
        }
        if (-not (Test-Path "yolov8n.pt")) {
          throw "دانلود yolov8n.pt با هیچ‌کدام از روش‌ها موفق نشد."
        }
        Write-Host "yolov8n.pt آماده‌ی بسته‌بندی است: $((Get-Item yolov8n.pt).Length) بایت"

    - name: Restore Nuitka cache (MinGW64 + ماژول‌های کامپایل‌شده)
      # روی مسیر quick_test (PyInstaller) اصلاً از Nuitka استفاده نمی‌شود، پس
      # restore این کش (که می‌تواند چند گیگابایت باشد) فقط وقت تلف می‌کند.
      if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.quick_test == 'true') }}
      id: nuitka-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~\AppData\Local\Nuitka\Nuitka\Cache
        # نکته‌ی مهم: قبلاً کلید این کش بر اساس hashFiles('**/*.py') بود، یعنی
        # با تغییر حتی یک خط کد پروژه، کل کش (شامل کامپایلر MinGW64 + همه‌ی
        # آبجکت‌های از قبل کامپایل‌شده‌ی torch/dlib/PyQt6) باطل می‌شد و بیلد
        # از صفر انجام می‌شد. حالا کلید فقط به وابستگی‌ها (requirements.txt)
        # بستگی دارد؛ Nuitka خودش هر ماژول را جدا هش می‌کند و فقط کد
        # تغییرکرده را دوباره کامپایل می‌کند.
        #
        # رفع ریشه‌ای مشکل «بیلد کنسل‌شده هیچ‌وقت کش را ذخیره نمی‌کند»: قبلاً
        # از خودِ actions/cache@v4 (که هم restore هم save را خودکار در فاز
        # "post" انجام می‌دهد) استفاده می‌شد. طبق مستندات رسمی گیت‌هاب، وقتی
        # jobی کنسل می‌شود (چه دستی چه به‌خاطر رسیدن به سقف زمانیِ ۶ ساعته -
        # دقیقاً همان اتفاقی که افتاد)، فقط stepهایی که صراحتاً شرط
        # ``if: always()`` دارند فرصت اجرا (در یک بازه‌ی ۵ دقیقه‌ای) پیدا
        # می‌کنند؛ فاز "post" خودکارِ actions/cache این شرط را ندارد، پس با
        # کنسل‌شدن job، ذخیره‌ی کش هم دقیقاً وسط همان لحظه قطع می‌شود - یعنی
        # با اینکه Nuitka واقعاً چند ساعت پیشرفت کرده بود، هیچ‌کدام از آن
        # پیشرفت روی دیسک کش‌شده برای اجرای بعدی باقی نمی‌ماند و هر بار از
        # صفر شروع می‌شود (یک حلقه‌ی بی‌پایان شکست). با جدا کردن restore/save
        # (این step فقط می‌خواند) و اضافه‌کردن یک step صریح "Save" با
        # ``if: always()`` دقیقاً بعد از step ساخت (پایین‌تر)، حالا ذخیره‌ی
        # کش هم در همان بازه‌ی ۵ دقیقه‌ای فرصت اجرا پیدا می‌کند.
        #
        # نکته‌ی فنی مهم درباره‌ی کلید کش: چون گیت‌هاب اجازه نمی‌دهد روی یک
        # کلید کش دقیقاً تکراری دوباره ذخیره شود (کلیدهای کش immutable
        # هستند)، اگر کلید save همیشه دقیقاً همین hashFiles ثابت باشد، از
        # دومین اجرا به بعد (که یک کش با همین کلید از قبل وجود دارد) هر
        # تلاش برای «Save» صرفاً بی‌صدا شکست می‌خورد و پیشرفت تازه هیچ‌وقت
        # واقعاً ذخیره نمی‌شود - دقیقاً همان مشکلی که قرار بود حل شود. برای
        # همین، کلید save (و restore) پایین‌تر شامل ``github.run_id`` هم
        # هست تا هر اجرا کلید یکتای خودش را بسازد؛ ``restore-keys`` با همان
        # پیشوند مشترک (بدون run_id) تنظیم شده تا جدیدترین کش ذخیره‌شده از
        # هر اجرای قبلی (با همین requirements.txt) پیدا و بازیابی شود.
        key: nuitka-cache-windows-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}
        restore-keys: |
          nuitka-cache-windows-${{ hashFiles('requirements.txt') }}-
          nuitka-cache-windows-

    # رفع درخواست «سریع خروجی بده برای تست»: تا اینجا quick_test=true فقط
    # --standalone به‌جای --onefile می‌داد، اما bottleneck واقعی («کامپایل C»)
    # در هر دو حالت یکسان و کند بود (Nuitka همیشه به C کامپایل می‌کند، فارغ از
    # onefile/standalone) - یعنی هیچ‌کدام واقعاً «سریع» نبودند. حالا برای
    # quick_test از ابزار کاملاً متفاوتی (PyInstaller) استفاده می‌شود که هیچ
    # کامپایل Cای انجام نمی‌دهد (فقط bytecode پایتون را جمع‌آوری/بسته‌بندی
    # می‌کند)، پس معمولاً چند دقیقه طول می‌کشد، نه چند ساعت - دقیقاً برای
    # تستِ سریعِ عملکرد برنامه کافی است. روی push به main (بدون ورودی دستی)
    # رفتار قبلی (Nuitka کامل با --onefile، باینری واقعی ماشین) دست‌نخورده
    # باقی می‌ماند - یعنی نسخه‌ی نهایی/توزیعی هنوز همان یک exe کامپایل‌شده است.
    - name: Build Executable with PyInstaller (quick test only - no C compile)
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.quick_test == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        python -m pip install pyinstaller
        if ($LASTEXITCODE -ne 0) { throw "نصب PyInstaller با کد $LASTEXITCODE شکست خورد." }

        $pyiArgs = @(
          "--onedir"
          "--noconfirm"
          "--name=CCTV_CMS"
          "--windowed"
          "--add-data=faces;faces"
          "--add-data=yolov8n.pt;."
          "--collect-all=ultralytics"
          "--collect-all=torch"
          "--collect-all=torchvision"
          "--collect-all=face_recognition_models"
          "--collect-all=cv2"
          "--distpath=dist"
          "main.py"
        )

        Write-Host "PyInstaller command: python -m PyInstaller $($pyiArgs -join ' ')"
        python -m PyInstaller @pyiArgs

        if ($LASTEXITCODE -ne 0) {
          Write-Host "##[error] PyInstaller با کد خروج $LASTEXITCODE شکست خورد. متن بالای همین لاگ را ببینید."
          throw "PyInstaller build failed with exit code $LASTEXITCODE"
        }

    - name: Build Executable with Nuitka (portable, compiled to machine code)
      if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.quick_test == 'true') }}
      shell: pwsh
      run: |
        # نکته‌ی مهم: بدون این خط، اگر یکی از دستورات زیر (pip install یا
        # خودِ نویتکا) با کد خطا برگرده، pwsh پیش‌فرض به کارش ادامه می‌دهد
        # و log ممکن است خالی/گمراه‌کننده به نظر برسد (دقیقاً چیزی که در
        # اجرای قبلی دیدیم: annotation "Error:" بدون هیچ متنی). با این
        # تنظیم، هر خطا فوراً و با پیام کامل متوقف‌کننده می‌شود.
        $ErrorActionPreference = "Stop"

        python -m pip install nuitka
        if ($LASTEXITCODE -ne 0) { throw "نصب Nuitka با کد $LASTEXITCODE شکست خورد." }

        $modeArgs = @("--onefile")

        # رفع ریشه‌ی اصلیِ «بیلد به سقف ۶ ساعته‌ی گیت‌هاب می‌خورد»:
        # ---------------------------------------------------------------
        # قبلاً اینجا --low-memory بود که به‌طور ضمنی --jobs=1 را هم اعمال
        # می‌کند (طبق مستندات خودِ Nuitka) - یعنی کامپایل تمام فایل‌های C
        # حجم عظیم torch+torchvision+ultralytics+dlib+PyQt6 کاملاً
        # سریالی/تک‌هسته‌ای انجام می‌شد. رانرهای windows-latest گیت‌هاب برای
        # مخزن‌های عمومی واقعاً ۴ هسته‌ی پردازشی و ۱۶ گیگابایت رم دارند (نه
        # ۲ هسته/۷ گیگابایتی که در مستندات قدیمی‌تر رایج بود) - یعنی
        # --low-memory اینجا کاملاً بیش‌ازحد محافظه‌کارانه بود: هم رم کافی
        # برای کامپایل موازی وجود دارد، هم سه‌چهارم ظرفیت CPU رانر
        # بی‌استفاده می‌ماند. نتیجه‌ی این تک‌هسته‌ای بودن دقیقاً همان چیزی
        # بود که در اجرای قبلی دیدیم: بعد از ۶ ساعت کامل هنوز تمام نشده
        # بود و job با خطای «exceeded the maximum execution time» کنسل شد.
        #
        # اینجا به‌جای --low-memory، از --jobs متناسب با تعداد هسته‌های
        # واقعیِ همین رانر استفاده می‌شود (پویا محاسبه می‌شود، نه عدد ثابت،
        # چون این عدد بین نوع رانر گیت‌هاب - عمومی/خصوصی/self-hosted - فرق
        # دارد) تا حداکثر استفاده از سخت‌افزار موجود انجام شود؛ یک هسته هم
        # برای خودِ سیستم‌عامل/رانر کنار گذاشته می‌شود (نه همه‌ی هسته‌ها)
        # تا کمی حاشیه‌ی امن باقی بماند.
        $cpuCount = [int]$Env:NUMBER_OF_PROCESSORS
        $jobCount = [Math]::Max($cpuCount - 1, 1)
        Write-Host "CPU cores: $cpuCount -> using --jobs=$jobCount"

        # به‌جای دستور تک‌خطیِ طولانی با ادامه‌خط بک‌تیک (`) - که با هر
        # فاصله‌ی نامرئی بعدش کل خط بعدی را جدا می‌کند و همین می‌تواند
        # باعث شود main.py اصلاً به نویتکا نرسد (که دقیقاً همان رفتاری
        # است که دیدیم: نویتکا بدون هیچ فایل ورودی، فقط raw help چاپ کرده
        # و با کد ۱ خارج می‌شود) - همه‌ی آرگومان‌ها را در یک آرایه می‌سازیم.
        # داخل @() هر خط یک عنصر جداست، بدون نیاز به کاما یا بک‌تیک.
        $nuitkaArgs = @(
          $modeArgs
          "--mingw64"
          "--jobs=$jobCount"
          "--enable-plugin=pyqt6"
          "--windows-console-mode=disable"
          "--windows-company-name=IAS"
          "--windows-product-name=CCTV CMS"
          "--windows-file-version=1.0.0.0"
          "--windows-product-version=1.0.0.0"
          "--include-package=face_recognition"
          "--include-package-data=face_recognition_models"
          "--include-data-dir=faces=faces"
          "--include-package=ultralytics"
          "--include-package-data=ultralytics"
          "--include-package=torch"
          "--include-package=torchvision"
          # نکته‌ی مهم - تاریخچه‌ی این تصمیم: قبلاً اینجا چند ماژول از torch/
          # وابستگی‌هایش با --nofollow-import-to کنار گذاشته می‌شدند (sympy،
          # torch.onnx، torch.distributed، torch.utils.tensorboard،
          # torch.testing) با این فرض که چون این پروژه نه آموزش می‌دهد، نه
          # صادرات ONNX دارد، نه چندGPU/توزیع‌شده است، این‌ها زائدند و فقط
          # حجم exe را زیاد می‌کنند. این فرض غلط از آب درآمد: ultralytics
          # همان لحظه‌ی اول import شدنش (نه فقط وقتی واقعاً از آن قابلیت‌ها
          # استفاده شود) این ماژول‌ها را بدون قید-وشرط import می‌کند - و چون
          # هر بار فقط یکی از آن‌ها exclude بود، حذف یکی («torch.distributed»
          # در بیلد قبلی) فقط نوبت بعدی («torch.testing») را آشکار کرد - دقیقاً
          # همان الگوی موش‌وگربه که با پیام «Module ... was actively excluded»
          # هربار برای یک ماژول متفاوت روی UI ظاهر می‌شد. برای جلوگیری از
          # تکرار همین چرخه به‌ازای ماژول بعدی، دیگر هیچ‌کدام از زیرماژول‌های
          # torch/sympy را exclude نمی‌کنیم - بگذارید Nuitka هرچه واقعاً در
          # مسیر import قرار دارد را کامپایل کند؛ تنها هزینه‌اش چند مگابایت
          # بیشتر حجم exe است، نه یک ویژگی که برای کاربر نهایی بی‌سروصدا
          # غیرفعال بماند.

          "--include-data-files=yolov8n.pt=yolov8n.pt"

          # نکته‌ی مهم: این سه ماژول جداگانه از exclude‌های قبلی (torch.onnx،
          # torch.distributed و ...) هستند و به همان دلیل حذف نشدند - این‌ها
          # فقط جدول‌های عددیِ خودکار-تولیدشده‌ی sympy برای حل معادلات درجه‌ی
          # ۵ و محاسبه‌ی گروه‌های گالوا هستند (sympy خودش مستقیم در
          # requirements.txt نیست؛ از طریق torch.fx وارد می‌شود). فایل
          # polyquinticconst.py به‌تنهایی چند مگابایت کد تولیدی است و
          # کامپایلش با gcc ساعت‌ها طول می‌کشد (همان چیزی که در لاگ با
          # "Slow C compilation detected... scalability problem" روی
          # module.sympy.polys.polyquinticconst.o دیده شد). این پروژه هرگز
          # معادلات درجه‌بالا/گروه گالوا را در مسیر اینفرنس YOLO یا
          # face_recognition صدا نمی‌زند، پس exclude کردن این زیرماژول‌های
          # مشخص (نه کل sympy یا کل torch) ریسکی برای کارکرد برنامه ندارد
          # و ساعت‌ها از زمان build کم می‌کند.
          "--nofollow-import-to=sympy.polys.polyquinticconst"
          "--nofollow-import-to=sympy.polys.numberfields.resolvent_lookup"
          "--nofollow-import-to=sympy.polys.numberfields.galoisgroups"

          "--output-dir=dist"
          "--output-filename=CCTV_CMS.exe"
          "--assume-yes-for-downloads"
          "main.py"
        )

        Write-Host "Nuitka command: python -m nuitka $($nuitkaArgs -join ' ')"
        python -m nuitka @nuitkaArgs

        if ($LASTEXITCODE -ne 0) {
          Write-Host "##[error] Nuitka با کد خروج $LASTEXITCODE شکست خورد. متن بالای همین لاگ را ببینید."
          throw "Nuitka build failed with exit code $LASTEXITCODE"
        }

    # رفع ریشه‌ای مشکل «پر شدن سقف ۱۰ گیگابایتیِ کش گیت‌هاب»: چون کلید کش
    # Nuitka بر اساس hashFiles('**/*.py') است، هر commit که حتی یک خط
    # پایتون را عوض کند یک کش کاملاً جدید (و چندگیگابایتی، چون شامل خودِ
    # کامپایلر MinGW64 + آبجکت‌های کامپایل‌شده‌ی torch/ultralytics/dlib
    # است) می‌سازد. گیت‌هاب کش‌های قدیمی را خودکار پاک نمی‌کند، فقط وقتی
    # سقف ۱۰ گیگابایتِ کل مخزن رد شود قدیمی‌ترین‌ها را حذف (LRU) می‌کند -
    # همین باعث می‌شد گاهی build سریع (کش hit) و گاهی خیلی کند (کش evict
    # شده) باشد.
    #
    # نکته‌ی مهم درباره‌ی ترتیب: این step عمداً *قبل* از «Save Nuitka cache»
    # پایین‌تر قرار گرفته (نه بعدش) - چون حالا کلید هر اجرا یکتاست
    # (``run_id``دار)، اگر پاک‌سازی *بعد* از ذخیره اجرا می‌شد، همین کش
    # تازه‌ساخته‌شده را هم (چون با همان پیشوند مشترک match می‌کند) پاک
    # می‌کرد - دقیقاً نقض هدف کل این تغییر. با این ترتیب (پاک‌سازیِ
    # کش‌های *قدیمی* از اجراهای قبلی، سپس ذخیره‌ی کش *تازه* از همین اجرا)،
    # همیشه فقط آخرین نسخه نگه داشته می‌شود.
    - name: Clean up old caches (جلوگیری از پر شدن سقف ۱۰ گیگابایتی کش)
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for prefix in "nuitka-cache-windows-" "pip-wheels-windows-"; do
          echo "Checking caches with prefix: $prefix"
          gh cache list --repo "${{ github.repository }}" --ref "${{ github.ref }}" --limit 100 --json id,key \
            --jq ".[] | select(.key | startswith(\"$prefix\")) | .id" \
            | while read -r id; do
                echo "Deleting old cache id=$id (prefix=$prefix)"
                gh cache delete "$id" --repo "${{ github.repository }}" || true
              done
        done

    # رفع ریشه‌ای مشکل «بیلد ناموفق/کنسل‌شده هیچ‌وقت کش را ذخیره نمی‌کند»:
    # این step صراحتاً از actions/cache/save استفاده می‌کند (نه فاز خودکار
    # "post" یک step ترکیبی restore+save) و شرط ``if: always()`` دارد -
    # یعنی طبق مستندات رسمی گیت‌هاب، حتی اگر step ساخت با خطا شکست بخورد یا
    # کل job کنسل شود (رسیدن به سقف ۶ ساعته)، این step هم در همان بازه‌ی
    # ۵ دقیقه‌ای cancellation فرصت اجرا پیدا می‌کند - یعنی هرچقدر Nuitka
    # واقعاً پیش رفته بود (حتی اگر کامل نشده) روی کش گیت‌هاب ذخیره می‌شود و
    # اجرای بعدی از همان‌جا ادامه می‌دهد، نه از صفر. کلید شامل ``run_id``
    # است تا هیچ‌وقت با کلید (immutable) یک کش قبلی برخورد نکند - رجوع کنید
    # به توضیح داخل step «Restore Nuitka cache» بالاتر.
    - name: Save Nuitka cache (حتی اگر ساخت ناموفق/کنسل شود)
      # روی مسیر quick_test اصلاً Nuitka اجرا نشده، پس چیزی برای ذخیره نیست.
      if: ${{ always() && !(github.event_name == 'workflow_dispatch' && github.event.inputs.quick_test == 'true') }}
      uses: actions/cache/save@v4
      with:
        path: |
          ~\AppData\Local\Nuitka\Nuitka\Cache
        key: nuitka-cache-windows-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}

    # پوشش هر سه حالت در یک آپلود: onefile فقط dist/CCTV_CMS.exe دارد،
    # standalone قدیمی پوشه‌ی dist/main.dist، و PyInstaller (quick_test) هم
    # پوشه‌ی dist/CCTV_CMS - هرکدام نبود، با if-no-files-found: ignore
    # بدون خطا رد می‌شود.
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CCTV_CMS_Windows_Portable
        path: |
          dist/CCTV_CMS.exe
          dist/main.dist/**
          dist/CCTV_CMS/**
        if-no-files-found: ignore
