name: Build Desktop EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      quick_test:
        description: 'بیلد سریع برای تست: standalone (پوشه) بجای onefile (یک exe فشرده) - فقط وقتی دستی (Run workflow) اجرا کنید فعال است'
        type: boolean
        default: true

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Cache pip-built wheels (dlib و بقیه)
      id: pip-wheel-cache
      uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Local\pip\Cache
        key: pip-wheels-windows-py310-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          pip-wheels-windows-

    - name: Install CMake (فقط وقتی dlib هنوز کش‌نشده)
      if: steps.pip-wheel-cache.outputs.cache-hit != 'true'
      run: |
        choco install cmake --installargs "ADD_CMAKE_TO_PATH=System" --no-progress

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools<70" wheel
        pip install dlib --only-binary :all: || pip install dlib
        pip install git+https://github.com/ageitgey/face_recognition_models
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: Cache YOLOv8n weights
      id: yolo-weights-cache
      uses: actions/cache@v4
      with:
        path: yolov8n.pt
        key: yolov8n-weights-v1

    - name: Download YOLOv8n weights (فقط اگر در کش نبود)
      if: steps.yolo-weights-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"
        if (-not (Test-Path "yolov8n.pt")) {
          $found = Get-ChildItem -Path $env:USERPROFILE -Recurse -Filter "yolov8n.pt" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) { Copy-Item $found.FullName -Destination "yolov8n.pt" }
        }
        if (-not (Test-Path "yolov8n.pt")) {
          Invoke-WebRequest -Uri "https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt" -OutFile "yolov8n.pt"
        }
        if (-not (Test-Path "yolov8n.pt")) {
          throw "دانلود yolov8n.pt با هیچ‌کدام از روش‌ها موفق نشد."
        }
        Write-Host "yolov8n.pt آماده‌ی بسته‌بندی است: $((Get-Item yolov8n.pt).Length) بایت"

    - name: Cache Nuitka (MinGW64 + ماژول‌های کامپایل‌شده)
      uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Local\Nuitka\Nuitka\Cache
        key: nuitka-cache-windows-${{ hashFiles('**/*.py') }}
        restore-keys: |
          nuitka-cache-windows-

    # رفع درخواست «سریع خروجی بده برای تست»: وقتی این workflow را دستی
    # (Run workflow) با quick_test=true اجرا کنید، بجای --onefile از
    # --standalone استفاده می‌شود. --onefile یک مرحله‌ی اضافه (فشرده‌سازی
    # کل باینری + باز کردن خودکارش در حافظه‌ی موقت هر بار که کاربر اجرا
    # می‌کند) دارد که برای این حجم (torch+ultralytics+dlib) خودش چند دقیقه
    # از زمان build را می‌گیرد و اصلاً به سرعت *کامپایل* کمکی نمی‌کند، فقط
    # مرحله‌ی بسته‌بندی نهایی را کند می‌کند. --standalone همان کامپایل و
    # همان فایل‌ها را تولید می‌کند اما در یک پوشه (dist/main.dist) رها
    # می‌شوند، بدون فشرده‌سازی - برای تستِ سریعِ داخلی کافی است، فقط باید
    # کل پوشه با هم منتقل/اجرا شود، نه یک exe تکی قابل توزیع.
    # روی push به main (بدون ورودی دستی) رفتار قبلی (onefile کامل) دست
    # نخورده باقی می‌ماند - یعنی نسخه‌ی نهایی/توزیعی هنوز همان یک exe است.
    - name: Build Executable with Nuitka (portable, compiled to machine code)
      shell: pwsh
      run: |
        python -m pip install nuitka

        $isQuick = "${{ github.event.inputs.quick_test }}" -eq "true"
        $modeArgs = if ($isQuick) { @("--standalone") } else { @("--onefile") }
        Write-Host "Build mode: $(if ($isQuick) { 'QUICK TEST (standalone)' } else { 'FULL (onefile)' })"

        python -m nuitka `
          @modeArgs `
          --mingw64 `
          --enable-plugin=pyqt6 `
          --windows-console-mode=disable `
          --company-name="IAS" `
          --product-name="CCTV CMS" `
          --file-version="1.0.0.0" `
          --product-version="1.0.0.0" `
          --include-package=face_recognition `
          --include-package-data=face_recognition_models `
          --include-data-dir=faces=faces `
          --include-package=ultralytics `
          --include-package-data=ultralytics `
          --include-package=torch `
          --include-package=torchvision `
          --nofollow-import-to=sympy `
          --nofollow-import-to=torch.onnx `
          --nofollow-import-to=torch.distributed `
          --nofollow-import-to=torch.utils.tensorboard `
          --nofollow-import-to=torch.testing `
          --include-data-files=yolov8n.pt=yolov8n.pt `
          --output-dir=dist `
          --output-filename=CCTV_CMS.exe `
          --assume-yes-for-downloads `
          --jobs=$Env:NUMBER_OF_PROCESSORS `
          main.py

    # رفع ریشه‌ای مشکل «پر شدن سقف ۱۰ گیگابایتیِ کش گیت‌هاب»: چون کلید کش
    # Nuitka بر اساس hashFiles('**/*.py') است، هر commit که حتی یک خط
    # پایتون را عوض کند یک کش کاملاً جدید (و چندگیگابایتی، چون شامل خودِ
    # کامپایلر MinGW64 + آبجکت‌های کامپایل‌شده‌ی torch/ultralytics/dlib
    # است) می‌سازد. گیت‌هاب کش‌های قدیمی را خودکار پاک نمی‌کند، فقط وقتی
    # سقف ۱۰ گیگابایتِ کل مخزن رد شود قدیمی‌ترین‌ها را حذف (LRU) می‌کند -
    # همین باعث می‌شد گاهی build سریع (کش hit) و گاهی خیلی کند (کش evict
    # شده) باشد. این مرحله بعد از هر build موفق، تمام کش‌های قدیمیِ همین
    # شاخه با پیشوند nuitka-cache-windows- یا pip-wheels-windows- را پاک
    # می‌کند (به‌جز همان کشی که همین الان در پایان این job ذخیره می‌شود -
    # چون ذخیره‌ی خودکار کش توسط actions/cache بعد از تمام این مراحل، در
    # فاز "post" انجام می‌شود، پس اینجا هنوز وجود ندارد که پاک شود). نتیجه:
    # همیشه فقط یک نسخه (آخرین) از هر کش نگه داشته می‌شود، نه ده‌ها نسخه‌ی
    # منسوخ که فضا را اشغال کنند.
    - name: Clean up old caches (جلوگیری از پر شدن سقف ۱۰ گیگابایتی کش)
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for prefix in "nuitka-cache-windows-" "pip-wheels-windows-"; do
          echo "Checking caches with prefix: $prefix"
          gh cache list --repo "${{ github.repository }}" --ref "${{ github.ref }}" --limit 100 --json id,key \
            --jq ".[] | select(.key | startswith(\"$prefix\")) | .id" \
            | while read -r id; do
                echo "Deleting old cache id=$id (prefix=$prefix)"
                gh cache delete "$id" --repo "${{ github.repository }}" || true
              done
        done

    # پوشش هر دو حالت در یک آپلود: در حالت onefile فقط dist/CCTV_CMS.exe
    # وجود دارد، در حالت standalone فقط پوشه‌ی dist/main.dist - هرکدام
    # نبود، با if-no-files-found: ignore بدون خطا رد می‌شود.
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CCTV_CMS_Windows_Portable
        path: |
          dist/CCTV_CMS.exe
          dist/main.dist/**
        if-no-files-found: ignore
