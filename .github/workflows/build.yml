name: Build Desktop EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# رفع درخواست «سریع خروجی بده»: اگر چند بار پشت‌سرهم push کنید، اجرای
# قبلیِ هنوز در حال build همین شاخه لغو می‌شود و فقط آخرین commit ساخته
# می‌شود - وقت CI صرف ساختن نسخه‌های میانی/منسوخ نمی‌شود.
concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        # کش کردن پکیج‌های pip بر اساس محتوای requirements.txt. اجرای بعدی که
        # requirements.txt عوض نشده باشد، این پکیج‌ها را دوباره دانلود نمی‌کند.
        cache: 'pip'
        cache-dependency-path: requirements.txt

    # dlib روی ویندوز wheel آماده در PyPI ندارد و هر بار از سورس با CMake
    # کامپایل می‌شود - به‌تنهایی کندترین بخش این workflow (اغلب چند دقیقه).
    # این کش همان wheel از پیش کامپایل‌شده را نگه می‌دارد تا اجرای بعدی
    # (وقتی نسخه‌ی پایتون/dlib عوض نشده) اصلاً کامپایل نکند.
    - name: Cache pip-built wheels (dlib و بقیه)
      id: pip-wheel-cache
      uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Local\pip\Cache
        key: pip-wheels-windows-py310-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          pip-wheels-windows-py310-

    # رفع درخواست «سریع‌تر»: نصب CMake خودش حدود ۱ تا ۲ دقیقه طول می‌کشد.
    # dlib فقط وقتی واقعاً از سورس کامپایل می‌شود به آن نیاز دارد؛ اگر کش
    # بالا از یک اجرای قبلی با همین requirements.txt کامل موفق (hit) باشد،
    # wheel از پیش کامپایل‌شده‌ی dlib همان‌جا هست و اصلاً نیازی به CMake
    # نیست - این مرحله در آن حالت کامل رد (skip) می‌شود.
    - name: Install CMake (فقط وقتی dlib هنوز کش‌نشده)
      if: steps.pip-wheel-cache.outputs.cache-hit != 'true'
      run: |
        choco install cmake --installargs "ADD_CMAKE_TO_PATH=System" --no-progress

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools<70" wheel
        pip install dlib --only-binary :all: || pip install dlib
        pip install git+https://github.com/ageitgey/face_recognition_models
        # نکته‌ی مهم درباره‌ی حجم و سرعت: نصب معمولی `pip install ultralytics`
        # روی ویندوز، torch را از PyPI معمولی نصب می‌کند که (بسته به نسخه)
        # وزن CUDA همراهش می‌آید - چند برابر بزرگ‌تر از نسخه‌ی CPU-only، هم
        # دانلودش کندتر است و هم بعداً بسته‌بندی‌اش با Nuitka. چون این برنامه
        # هرگز روی GPU اجرا نمی‌شود، نسخه‌ی CPU-only از ایندکس رسمی pytorch
        # *قبل* از requirements.txt نصب می‌شود؛ وقتی به ultralytics (که torch
        # را پیش‌نیاز می‌خواهد) می‌رسیم، همین نسخه‌ی سبک از قبل نصب‌شده کفایت
        # می‌کند و pip دوباره نسخه‌ی سنگین را جایگزین نمی‌کند.
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    # رفع درخواست «همه‌چیز فقط از طریق گیت‌هاب، بدون نصب چیزی روی سیستم
    # کاربر»: وزن مدل تشخیص شخص (yolov8n.pt، حدود ۶ مگابایت) همین‌جا - روی
    # سرور گیت‌هاب که اینترنت دارد - دانلود و مستقیماً کنار main.py قرار
    # می‌گیرد؛ چند مرحله پایین‌تر با فلگ Nuitka
    # --include-data-files=yolov8n.pt=yolov8n.pt داخل خودِ exe پرتابل
    # بسته‌بندی می‌شود. رفع درخواست «سریع‌تر»: چون این فایل عملاً هیچ‌وقت
    # عوض نمی‌شود، با یک کلید ثابت کش می‌شود - از دومین اجرا به بعد، این
    # دانلود کاملاً رد (skip) می‌شود.
    - name: Cache YOLOv8n weights
      id: yolo-weights-cache
      uses: actions/cache@v4
      with:
        path: yolov8n.pt
        key: yolov8n-weights-v1

    - name: Download YOLOv8n weights (فقط اگر در کش نبود)
      if: steps.yolo-weights-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"
        if (-not (Test-Path "yolov8n.pt")) {
          # بعضی نسخه‌های ultralytics به‌جای پوشه‌ی جاری، در یک پوشه‌ی کش
          # کنار پروفایل کاربر دانلود می‌کنند؛ در آن صورت پیدا و کپی می‌شود.
          $found = Get-ChildItem -Path $env:USERPROFILE -Recurse -Filter "yolov8n.pt" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) { Copy-Item $found.FullName -Destination "yolov8n.pt" }
        }
        if (-not (Test-Path "yolov8n.pt")) {
          # آخرین راه‌حل: دانلود مستقیم از انتشار رسمی ultralytics/assets.
          Invoke-WebRequest -Uri "https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt" -OutFile "yolov8n.pt"
        }
        if (-not (Test-Path "yolov8n.pt")) {
          throw "دانلود yolov8n.pt با هیچ‌کدام از روش‌ها موفق نشد."
        }
        Write-Host "yolov8n.pt آماده‌ی بسته‌بندی است: $((Get-Item yolov8n.pt).Length) بایت"

    # Nuitka برای هر build، کامپایلر MinGW64 را دانلود می‌کند و ماژول‌های
    # پایتون را به C کامپایل می‌کند. کش‌کردن پوشه‌ی کش داخلی Nuitka
    # (دانلود MinGW64 + کش کامپایل ماژول‌ها) از دانلود/کامپایل تکراری در
    # اجراهای بعدی (وقتی سورس عوض نشده) جلوگیری می‌کند - این مهم‌ترین کش
    # برای سرعت اجراهای بعدی است، چون کامپایل torch/ultralytics به C
    # سنگین‌ترین بخش این workflow است.
    - name: Cache Nuitka (MinGW64 + ماژول‌های کامپایل‌شده)
      uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Local\Nuitka\Nuitka\Cache
        key: nuitka-cache-windows-${{ hashFiles('**/*.py') }}
        restore-keys: |
          nuitka-cache-windows-

    - name: Build Executable with Nuitka (portable, compiled to machine code)
      run: |
        python -m pip install nuitka
        python -m nuitka `
          --onefile `
          --mingw64 `
          --enable-plugin=pyqt6 `
          --windows-console-mode=disable `
          --company-name="IAS" `
          --product-name="CCTV CMS" `
          --file-version="1.0.0.0" `
          --product-version="1.0.0.0" `
          --include-package=face_recognition `
          --include-package-data=face_recognition_models `
          --include-data-dir=faces=faces `
          --include-package=ultralytics `
          --include-package-data=ultralytics `
          --include-package=torch `
          --include-package=torchvision `
          --nofollow-import-to=sympy `
          --nofollow-import-to=torch.onnx `
          --nofollow-import-to=torch.distributed `
          --nofollow-import-to=torch.utils.tensorboard `
          --nofollow-import-to=torch.testing `
          --include-data-files=yolov8n.pt=yolov8n.pt `
          --output-dir=dist `
          --output-filename=CCTV_CMS.exe `
          --assume-yes-for-downloads `
          --jobs=$Env:NUMBER_OF_PROCESSORS `
          main.py
        # نکته‌ی «چرا بدون --include-package-data=torch/torchvision»: آن
        # فلگ فقط برای فایل‌های غیرِپایتونی (yaml/ttf/json و ...) لازم است -
        # مثل ultralytics که واقعاً به آن‌ها نیاز دارد و بالا نگه داشته شده.
        # torch/torchvision تقریباً هیچ فایل غیرکدی لازمی در زمان اجرا
        # ندارند؛ فایل‌های باینری‌شان (.pyd/.dll) هم مستقل از این فلگ و فقط
        # با دنبال‌کردن import (--include-package) به‌طور خودکار بسته‌بندی
        # می‌شوند. حذف این دو فلگ اضافه، حجم درخت فایل‌هایی که Nuitka باید
        # اسکن/کپی کند (و در نتیجه زمان build) را کم می‌کند، بدون افتادن
        # هیچ فایل واقعاً لازمی.
        #
        # نکته‌ی مهم‌تر - چرا --nofollow-import-to=sympy: با
        # --include-package=torch مجبور می‌کنیم Nuitka *کل* درخت torch را
        # بگنجاند، حتی بخش‌هایی که این برنامه اصلاً صدا نمی‌زند (ما فقط
        # YOLO(...).predict استفاده می‌کنیم، نه torch.onnx/torch.compile/
        # torch.distributed). بعضی از همین بخش‌های استفاده‌نشده، خودشان
        # sympy را import می‌کنند - و sympy شامل فایل‌هایی مثل
        # polys/polyquinticconst.py است که فقط جدول ضرایب عددی برای حل
        # نمادین معادلات درجه‌پنج است، نه منطق برنامه؛ حجمش آن‌قدر زیاد است
        # که کامپایلرِ C روی بهینه‌سازی‌اش گیر می‌کند (می‌تواند تنها همین یک
        # فایل، ده‌ها دقیقه طول بکشد - دقیقاً همان چیزی که در لاگ دیدید:
        # "Slow C compilation detected ... scalability problem"). چون
        # sympy برای inference ساده‌ی YOLO اصلاً لازم نیست، با
        # --nofollow-import-to کاملاً از مسیر کامپایل کنار گذاشته می‌شود؛
        # اگر جایی واقعاً به آن نیاز بود (که در مسیر استفاده‌ی این برنامه
        # نیست)، فقط همان یک فراخوانی خطای import می‌دهد، نه کل build را کند
        # می‌کند. torch.onnx/torch.distributed/torch.utils.tensorboard/
        # torch.testing هم به همین دلیل (زیرسیستم‌های سنگین و استفاده‌نشده)
        # کنار گذاشته شده‌اند.

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CCTV_CMS_Windows_Portable
        path: dist/CCTV_CMS.exe
